name: clear-image

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  clear-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear unused images
        run: |
          python .github/scripts/clear_unused_images.py \
            --scan-directory "." \
            --ignore-paths "source/img"

      - name: Commit cleanup changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No unused images removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clear unused images"
          git push
